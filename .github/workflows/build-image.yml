name: Build iPolloOS Plugin image

on:
  workflow_dispatch:
  push:
    branches: [main, runtime]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    strategy:
      matrix:
        archs:
          - arch: amd64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.archs.runs-on || 'ubuntu-24.04' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push for ${{ matrix.archs.arch }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.archs.arch }}
          push: true
          tags: |
            ghcr.io/devin-axis/ipolloos-plugin:${{ github.sha }}-${{ matrix.archs.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=iPolloOS Plugin image
          cache-from: type=gha,scope=${{ matrix.archs.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.archs.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.archs.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-image:
    runs-on: ubuntu-latest
    needs:
      - build-image
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          GITHUB_LATEST="ghcr.io/devin-axis/ipolloos-plugin:latest"
          GITHUB_SHA="ghcr.io/devin-axis/ipolloos-plugin:${{ github.sha }}"
          TAGS="$GITHUB_LATEST $GITHUB_SHA"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="$TAGS ghcr.io/devin-axis/ipolloos-plugin:${{ github.ref_name }}"
          fi

          for TAG in $TAGS; do
            echo "Creating manifest list for: $TAG"
            docker buildx imagetools create -t $TAG \
              $(printf 'ghcr.io/devin-axis/ipolloos-plugin@sha256:%s ' *)
            sleep 2
          done
